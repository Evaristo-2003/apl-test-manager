
<!DOCTYPE html>

<title> TEST REPORT</title>

<style>
.subsequence-title {
    margin-top: 15px;

    padding-bottom: 10px;
}

.summary-table {
    border-collapse: collapse;

}

.summary-table td,

    border: 1px solid #CFCFCF;

}

.summary-table th {

}

.info-table {
    border-collapse: collapse;
    width: 100%;
}
.adc-summary {
    background: #F4F7F9;
    border-left: 5px solid #5B9BD5;
    padding: 8px 12px;
    margin-bottom: 10px;
    font-size: 13px;
}
.info-table td {
    border: 1px solid #D0D0D0;
    padding: 6px;
}

.label {
    width: 250px;
    font-weight: bold;
    background: #EFEFEF;
}

.pass {
    background: #C6EFCE;
    color: #006100;

}

.fail {
    background: #FFC7CE;
    color: #9C0006;
    font-weight: bold;
}

.skipped {
    background: #E7E6E6;
    color: #404040;
    font-weight: bold;
}

.section-title {
    background: #DDEAF2;
    padding: 6px;
    margin-top: 10px;
    margin-bottom: 4px;
    border: 1px solid #C4D2DA;
    font-weight: bold;
}

.detail-table {
    border-collapse: collapse;
    width: 100%;
}

.detail-table td {
    border: 1px solid #D0D0D0;
    padding: 6px;
}
.detail-table th {
    border: 1px solid #D0D0D0;
    padding: 6px;
    background: #E9EEF2;
    font-weight: bold;
    text-align: center;
}
.detail-label {
    width: 250px;
    background: #EFEFEF;
    font-weight: bold;
}

.raw-box {
    background: #F7F7F7;
    border: 1px solid #D5D5D5;
    padding: 8px;
    overflow-x: auto;
    white-space: pre-wrap;
    font-family: Consolas;
    font-size: 12px;
}

</style>
