<head>

<meta charset="utf-8">

<title> TEST REPORT</title>

<style>
.subsequence-title {
    margin-top: 15px;
    margin-left: 20px;

    background: #F4F7F9;

    padding: 6px 10px;

    border-left: 5px solid #5B9BD5;

    font-weight: bold;

    color: #1F2937;
}
.test-summary {
    background: #F4F7F9;
    border-left: 5px solid #5B9BD5;
    padding: 8px 12px;
    margin-top: 5px;
    margin-bottom: 10px;
    font-size: 13px;
}
.subsequence-content {
    margin-left: 25px;
}
body {
    font-family: Segoe UI, Arial, sans-serif;
    margin: 20px;
    background: white;
}

h1 {
    border-bottom: 2px solid #404040;
    padding-bottom: 10px;
}

.summary-table {
    border-collapse: collapse;
    width: 700px;
}

.summary-table td,
.summary-table th {
    border: 1px solid #CFCFCF;
    padding: 8px;
}

.summary-table th {
    background: #E9EEF2;
}

.test-block {
    margin-top: 25px;
}

.test-title {
    background: #BFD5E1;
    padding: 8px;
    font-weight: bold;
    border: 1px solid #A9BEC8;
    font-size: 14px;
}

.info-table {
    border-collapse: collapse;
    width: 100%;
}
.adc-summary {
    background: #F4F7F9;
    border-left: 5px solid #5B9BD5;
    padding: 8px 12px;
    margin-bottom: 10px;
    font-size: 13px;
}
.info-table td {
    border: 1px solid #D0D0D0;
    padding: 6px;
}

.label {
    width: 250px;
    font-weight: bold;
    background: #EFEFEF;
}

.pass {
    background: #C6EFCE;
    color: #006100;
    font-weight: bold;
}

.fail {
    background: #FFC7CE;
    color: #9C0006;
    font-weight: bold;
}

.skipped {
    background: #E7E6E6;
    color: #404040;
    font-weight: bold;
}

.section-title {
    background: #DDEAF2;
    padding: 6px;
    margin-top: 10px;
    margin-bottom: 4px;
    border: 1px solid #C4D2DA;
    font-weight: bold;
}

.detail-table {
    border-collapse: collapse;
    width: 100%;
}

.detail-table td {
    border: 1px solid #D0D0D0;
    padding: 6px;
}
.detail-table th {
    border: 1px solid #D0D0D0;
    padding: 6px;
    background: #E9EEF2;
    font-weight: bold;
    text-align: center;
}
.detail-label {
    width: 250px;
    background: #EFEFEF;
    font-weight: bold;
}
.header-container {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;

    border-bottom: 2px solid #404040;

    padding-bottom: 10px;
}

.header-info {

    flex: 1;
}

.header-title {

    font-size: 28px;

    font-weight: bold;

    color: #1F2937;

    margin-bottom: 10px;
}

.header-project {

    font-size: 18px;

    font-weight: 600;

    color: #404040;

    margin-bottom: 6px;
}

.header-logo {

    width: 220px;

    text-align: right;
}
.raw-box {
    background: #F7F7F7;
    border: 1px solid #D5D5D5;
    padding: 8px;
    overflow-x: auto;
    white-space: pre-wrap;
    font-family: Consolas;
    font-size: 12px;
}

</style>
